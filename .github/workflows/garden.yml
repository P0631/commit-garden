name: Grow garden

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grow the garden
        run: python -m commit_garden grow . --format svg --output assets/garden.svg
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/garden.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/garden.svg
            git commit -m "docs: regenerate garden"
            git push
          fi
